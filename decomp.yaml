name: Pokémon Emerald
platform: gba
versions:
  - name: us
    fullname: US
    sha1: f3ae088181bf583e55daf962a92bb46f4f1d07b7
    paths:
      # not in the repository: the build is checked against rom.sha1 instead
      target: baserom.gba
      build_dir: build/emerald
      map: pokeemerald.map
      compiled_target: pokeemerald.gba

tools:
  asmlift:
    # the DERIVED elf: a verified copy of pokeemerald.elf (make asmlift-elf). The normal
    # build compiles with agbcc -g, so the ELF already embeds full DWARF — names from
    # .symtab, declaration shapes (struct layouts, array element sizes) from that DWARF.
    elf: pokeemerald-syms.elf
